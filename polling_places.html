<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polling Places — Budget Tour 2.0: Bonds &amp; County Taxes</title>
<style>
:root{
  --heading-font:Helvetica,"Helvetica Neue",Arial,sans-serif;
  --bg:#faf5e9; --ink:#1e2b22; --body:#3f4a42; --muted:#6b7268;
  --green:#c5db7e; --green-dark:#4f6b18; --rust:#a63a1a; --cream:#fffdf6; --gold:#f4c542;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);
  font-family:"Public Sans","Helvetica Neue",Arial,sans-serif;
  line-height:1.45;-webkit-text-size-adjust:100%}
.page{max-width:44rem;margin:0 auto;
  padding:clamp(1.25rem,4vw,3rem) clamp(1rem,4vw,2.5rem) 2rem}
h1{margin:0 0 clamp(1.25rem,3vw,2.25rem);color:var(--ink);font-weight:700;text-align:center;
  font-family:var(--heading-font);
  line-height:1.1;font-size:clamp(1.6rem,4.6vw,3rem)}
.note{margin:0 auto;max-width:40rem;
  background:var(--green);border-radius:clamp(.3rem,.8vw,.6rem);text-align:center;
  color:var(--ink);padding:clamp(.85rem,2.4vw,1.3rem) clamp(1rem,3vw,1.6rem);
  font-size:clamp(.95rem,2vw,1.15rem);line-height:1.4}
.note strong{font-weight:700}
a{color:var(--green-dark);font-weight:700;text-decoration:underline;
  text-underline-offset:.15em;text-decoration-thickness:.09em}
a:hover{color:var(--rust)}
a:focus-visible{outline:2px solid var(--rust);outline-offset:.18em;border-radius:.15rem}
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
</head>
<body>
<main class="page">
  <h1>Have you voted yet?</h1>

  <p class="note">Early voting runs <strong>October 19 through 30</strong>. Election Day is
    <strong>Nov.&nbsp;3</strong>. Find your polling place
    <a href="https://experience.arcgis.com/experience/8204fc2e36cd4fac8729efcedd4fda7f/page/Page?views=Early-Voting">here</a>.</p>
</main>
</body>
</html>
