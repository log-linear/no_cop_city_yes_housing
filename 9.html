<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bond Basics: City Prop A — Budget Tour 2.0: Bonds &amp; County Taxes (Slide 9)</title>
<style>
:root{
  --bg:#faf5e9; --ink:#1e2b22; --body:#3f4a42; --muted:#6b7268;
  --green-dark:#4f6b18; --rust:#a63a1a; --cream:#fffdf6; --gold:#f4c542;
  --on-dark:#e6e0cf;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);
  font-family:"Public Sans","Helvetica Neue",Arial,sans-serif;
  line-height:1.45;-webkit-text-size-adjust:100%}
.page{max-width:56rem;margin:0 auto;
  padding:clamp(1.25rem,4vw,3rem) clamp(1rem,4vw,2.5rem) 2rem}
.eyebrow{margin:0 0 .5rem;color:var(--green-dark);font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;
  font-size:clamp(.75rem,1.6vw,.95rem)}
h1{margin:0 0 clamp(1.5rem,4vw,2.5rem);color:var(--ink);
  font-family:"Bowlby One SC",Impact,"Arial Black",sans-serif;font-weight:400;
  line-height:1.1;font-size:clamp(1.6rem,4.6vw,3rem)}
.stats{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:clamp(.75rem,2.5vw,1.5rem)}
.tile{flex:1 1 15rem;min-width:0;border-radius:clamp(.3rem,.8vw,.6rem);
  padding:clamp(1rem,3vw,1.75rem) clamp(.75rem,2.5vw,1.5rem);text-align:center}
.tile .num{display:block;color:var(--ink);font-weight:700;line-height:1;
  font-size:clamp(1.9rem,6vw,3.1rem)}
.tile .lab{display:block;margin-top:.5rem;font-size:clamp(.8rem,1.7vw,.98rem);
  line-height:1.35}
.tile--light{background:var(--cream);border:2px solid var(--ink)}
.tile--light .lab{color:var(--body)}
.tile--dark{background:var(--ink)}
.tile--dark .num{color:var(--gold)}
.tile--dark .lab{color:var(--on-dark)}
.arrow{flex:0 0 auto;width:clamp(2.5rem,7vw,4.5rem)}
.arrow img{display:block;width:100%;height:auto}
.ballot{margin-top:clamp(2rem,5vw,3.25rem);text-align:center}
h2{margin:0 0 clamp(1rem,3vw,1.6rem);color:var(--rust);font-weight:400;
  font-family:"Bowlby One SC",Impact,"Arial Black",sans-serif;
  font-size:clamp(1.15rem,3vw,1.9rem);line-height:1.2}
.ballot img{display:block;width:100%;max-width:22rem;height:auto;margin:0 auto;
  border:2px solid var(--ink);border-radius:clamp(.25rem,.6vw,.4rem);
  box-shadow:0 4px 18px rgba(30,43,34,.14)}
.sources{margin-top:clamp(1.5rem,4vw,2.5rem);color:var(--muted);text-align:center;
  font-size:clamp(.75rem,1.5vw,.9rem);line-height:1.5}
@media (max-width:34rem){
  .stats{flex-direction:column;align-items:stretch}
  .arrow{width:auto;display:flex;justify-content:center;order:2}
  .arrow img{width:2.75rem;height:auto;transform:rotate(90deg)}
  .tile--light{order:1}.tile--dark{order:3}
}

}
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Public+Sans:wght@400;600;700&display=swap">
</head>
<body>
<main class="page">
  <p class="eyebrow">Bond basics · City Prop A</p>
  <h1>Borrow $443M, repay $630M</h1>

  <div class="stats">
    <div class="tile tile--light">
      <span class="num">$443M</span>
      <span class="lab">What the city borrows</span>
    </div>
    <div class="arrow"><img src="9_img_1.png" alt="arrow pointing to repayment total"></div>
    <div class="tile tile--dark">
      <span class="num">$629.6M</span>
      <span class="lab">What taxpayers repay (city&rsquo;s estimate)</span>
    </div>
  </div>

  <section class="ballot">
    <h2>what you&rsquo;ll see on your ballot:</h2>
    <img src="9_img_2.png" alt="Sample of the City of Dallas Prop A question as it appears on the ballot">
  </section>

  <p class="sources">Source: City of Dallas bond election ordinance, Nov. 3, 2026 ($629,618,180 estimated repayment)</p>
</main>
</body>
</html>
